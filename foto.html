<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riscopriamo insieme questi 3 anni</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fce7f3, #fbcfe8, #f9a8d4);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            font-size: 2.4em;
            color: #d4869f;
            font-weight: 300;
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery {
            position: relative;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        img {
            width: 100%;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(212, 134, 159, 0.25);
            margin-bottom: 20px;
        }

        .caption {
            font-size: 1.3em;
            color: #d4869f;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .title {
            font-size: 1em;
            color: #555;
            font-style: italic;
            margin-bottom: 25px;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5em;
            color: #d4869f;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }

        .arrow:hover {
            color: #c85a7c;
        }

        .left {
            left: -50px;
        }

        .right {
            right: -50px;
        }

        @media (max-width: 600px) {
            .arrow {
                font-size: 2em;
                left: -30px;
                right: -30px;
            }
        }
    </style>
</head>
<body>
    <h1>Prima di vedere il tuo regalo (per davvero),<br>riscopriamo insieme questi 3 anni</h1>

    <div class="gallery">
        <span id="leftArrow" class="arrow left" onclick="prev()">&#8592;</span>

        <img id="foto" src="foto/ago23.jpg" alt="Agosto 2023">

        <p id="caption" class="caption">Agosto 2023</p>
        <p id="title" class="title">Titolo foto Agosto 2023</p>

        <span id="rightArrow" class="arrow right" onclick="next()">&#8594;</span>
    </div>
