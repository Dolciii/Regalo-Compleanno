<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riscopriamo insieme questi 3 anni</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fce7f3, #fbcfe8, #f9a8d4);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            font-size: 2.4em;
            color: #d4869f;
            font-weight: 300;
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery {
            position: relative;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        img {
            width: 100%;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(212, 134, 159, 0.25);
            margin-bottom: 20px;
        }

        .caption {
            font-size: 1.3em;
            color: #d4869f;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .title {
            font-size: 1em;
            color: #555;
            font-style: italic;
            margin-bottom: 25px;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5em;
            color: #d4869f;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, color 0.2s ease;
        }
        
        .arrow:hover {
            color: #c85a7c;
            transform: translateY(-50%) scale(1.15);
        }
        
        .arrow:active {
            color: #a84f6b;
            transform: translateY(-50%) scale(0.9);
        }

        .left {
            left: -50px;
        }

        .right {
            right: -50px;
        }

        .btn-continua {
            display: inline-block;
            background: #d4869f;
            color: white;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 1em;
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-continua:hover {
            background: #c85a7c;
        }

        .finale {
            font-size: 1.6em;
            color: #d4869f;
            font-weight: bold;
            text-align: center;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .arrow {
                font-size: 2em;
                left: -30px;
                right: -30px;
            }
        }
    </style>
</head>
<body>
    <h1>Prima di vedere il tuo regalo,<br>riscopriamo insieme questi 3 anni passati insieme</h1>

    <div id="contenuto" class="gallery">
        <span id="leftArrow" class="arrow left" onclick="prev()">&#8592;</span>

        <img id="foto" src="foto/ago23.jpg" alt="Agosto 2023">

        <p id="caption" class="caption">Agosto 2023</p>
        <p id="title" class="title">La prima chiamata pucci pucci</p>

        <span id="rightArrow" class="arrow right" onclick="next()">&#8594;</span>

        <div id="continuaBtnContainer"></div>
    </div>

    <script>
        const immagini = [
            { src: "foto/ago23.jpg", caption: "Agosto 2023", title: "La prima chiamata pucci pucci" },
            { src: "foto/set23.jpg", caption: "Settembre 2023", title: "Dai cinesi insieme a comprare le caramelle, con te mezzasnudata" },
            { src: "foto/ott23.jpg", caption: "Ottobre 2023", title: "Il compleanno dell'arrivo a mezzanotte, ma poco dopo... pace e bacini" },
            { src: "foto/nov23.jpg", caption: "Novembre 2023", title: "Venivo a dormire da te di nascosto e me ne andavo di nascosto" },
            { src: "foto/dic23.jpg", caption: "Dicembre 2023", title: "1 eri più bionda, 2 ti mancavo perchè ero un soldatino" },

            { src: "foto/gen24.jpg", caption: "Gennaio 2024", title: "L'armadio più magico che ci sia, pure di quello di Narnia. Se oggi lo apri non è cambiato di una virgola" },
            { src: "foto/feb24.jpg", caption: "Febbraio 2024", title: "La prima sushata" },
            { src: "foto/mar24.jpg", caption: "Marzo 2024", title: "Stranamente mora e stranamente in montagna" },
            { src: "foto/apr24.jpg", caption: "Aprile 2024", title: "Bimba con la frangetta" },
            { src: "foto/mag24.jpg", caption: "Maggio 2024", title: "Simbaaaa, miss down 2024" },
            { src: "foto/giu24.jpg", caption: "Giugno 2024", title: "Tu con le treccine, io che mi faccio inculare 3 euro, ma ti ho conquistata" },
            { src: "foto/lug24.jpg", caption: "Luglio 2024", title: "Per citare un grande film (Star Wars IV): A new hope .... in the Martina's life" },
            { src: "foto/ago24.jpeg", caption: "Agosto 2024", title: "Mega muso stratosferico, da notare i capelli biondissimi" },
            { src: "foto/set24.jpg", caption: "Settembre 2024", title: "TENERIFEEEE = MEGA MUSO SUPER GALATTICO" },
            { src: "foto/ott24.jpg", caption: "Ottobre 2024", title: "Finito il periodo dei musi, ho avuto la mia vendetta con questo mega fake regalo" },
            { src: "foto/nov24.jpg", caption: "Novembre 2024", title: "Tartuga in letargo, che con 15 gradi si ammala" },
            { src: "foto/dic24.jpg", caption: "Dicembre 2024", title: "Big surprise, TI AMO" },

            { src: "foto/gen25.jpg", caption: "Gennaio 2025", title: "Troppo imbarazzante per commentare" },
            { src: "foto/feb25.jpg", caption: "Febbraio 2025", title: "BIBIDI BOBIDI BU e MARTINA non c'è PIU" },
            { src: "foto/mar25.jpg", caption: "Marzo 2025", title: "Ecco spiegato perchè ti chiamo Spongibob" },
            { src: "foto/apr25.jpg", caption: "Aprile 2025", title: "Assurdamente brava a fare figura di M + MOVIELANDD" },
            { src: "foto/mag25.jpg", caption: "Maggio 2025", title: "E' passato un'anno e mezzo e ancora non sai fare benzina" },
            { src: "foto/giu25.jpg", caption: "Giugno 2025", title: "Tartina per la prima volta a Spotni, cit mi fa cagare la Ligura" },
            { src: "foto/lug25.jpg", caption: "Luglio 2025", title: "Bimba felice. Ora che fa l'università un pò meno..." },
            { src: "foto/ago25.jpg", caption: "Agosto 2025", title: "THE MOMENT BEFORE THE END" },
            { src: "foto/set25.jpg", caption: "Settembre 2025", title: "Martina stambecchina fa il record assoluto di salita e discesa dalla Grignetta, tempo record effettuato 12893928397231 ore, per fare 900 di dislivello" },
            { src: "foto/ott25.jpg", caption: "Ottobre 2025", title: "Pucci Pucci" },
            { src: "foto/nov25.jpg", caption: "Novembre 2025", title: "CHE GNOCCA, ma era più divertente la pistolina" },
            { src: "foto/dic25.jpg", caption: "Dicembre 2025", title: "Martina che scopre dove compreremo la casa" },

            { src: "foto/gen26.jpg", caption: "Gennaio 2026", title: "La MUMMIA dall'1 Gennaio al cinema, aka Martina odia la montagna" },
            { src: "foto/feb26.jpg", caption: "Febbraio 2026", title: "...e invece non troppo. Sta foto spacca" },
            { src: "foto/mar26.jpg", caption: "Marzo 2026", title: "Pippi tette corte" },
            { src: "foto/apr26.jpg", caption: "Aprile 2026", title: "Toporagno in montagna, imbarazzante..." },
            { src: "foto/mag26.jpg", caption: "Maggio 2026", title: "Chi è quel figo? + chiappetta" },
            { src: "foto/giu26.jpg", caption: "Giugno 2026", title: "Come siamo cambiati in questi anni... insieme" },
            { src: "foto/lug26.jpg", caption: "Luglio 2026", title: "....ZZZZZZZ" },
            { src: "foto/ago26.jpg", caption: "Agosto 2026", title: "Martina che gioca a scavare le buche" },
            { src: "foto/set26.jpg", caption: "Settembre 2026", title: "TADAAAAA citazione file parte 2 (Star Wars V): The lake strikes back" },
            { src: "foto/ott26.jpg", caption: "Ottobre 2026", title: "Amici e ovviamente immancabile la montagnaaaaa" }
        ];

        let indice = 0;

        function aggiornaFreccie() {
            const left = document.getElementById("leftArrow");
            const right = document.getElementById("rightArrow");
            const continua = document.getElementById("continuaBtnContainer");

            left.style.display = indice === 0 ? "none" : "block";
            right.style.display = indice === immagini.length - 1 ? "none" : "block";

            if (indice === immagini.length - 1) {
                continua.innerHTML = `<button class="btn-continua" onclick="finale()">Continua</button>`;
            } else {
                continua.innerHTML = "";
            }
        }

        function mostraFoto() {
            document.getElementById("foto").src = immagini[indice].src;
            document.getElementById("caption").innerText = immagini[indice].caption;
            document.getElementById("title").innerText = immagini[indice].title;

            aggiornaFreccie();
        }

        function next() {
            if (indice < immagini.length - 1) {
                indice++;
                mostraFoto();
            }
        }

        function prev() {
            if (indice > 0) {
                indice--;
                mostraFoto();
            }
        }

        function finale() {
            // Rimuove anche il titolo principale
            document.querySelector("h1").style.display = "none";
    
            // Sostituisce tutto il contenuto con la scritta finale
            document.getElementById("contenuto").innerHTML =
                `<p class="finale">Ora, per davvero, per ricevere il tuo regalo vai in camera da letto.</p>`;
        }

        mostraFoto();
    </script>
</body>
</html>
