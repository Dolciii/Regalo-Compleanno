<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collega gli indizi per indovinare il tuo regalo</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fce7f3, #fbcfe8, #f9a8d4);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: white;
            border-radius: 5px;
            max-width: 650px;
            width: 100%;
            padding: 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(212, 134, 159, 0.25);
            border: 1px solid rgba(212, 134, 159, 0.1);
        }
        h1 {
            font-size: 2.2em;
            color: #d4869f;
            font-weight: 300;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: #d4869f;
            color: white;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 1em;
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
            margin: 10px;
        }
        .btn:hover {
            background: #c85a7c;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Vuoi davvero scoprire il tuo regalo?</h1>

        <a class="btn" href="foto.html">Si</a>
        <a class="btn" href="foto.html">Si, suca</a>
    </div>
</body>
</html>
